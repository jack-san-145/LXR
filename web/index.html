<!--
  Configuration hooks, read by js/api.js:
    window.LXR_API_BASE   — override the API base path (defaults to "/api")
    window.LXR_DEMO_MODE  — set to true to preview the UI with mock data,
                             with no LXR daemon running. Off by default.
-->
<script>
  window.LXR_API_BASE = window.LXR_API_BASE || '/api';
  window.LXR_DEMO_MODE = false;
</script>
